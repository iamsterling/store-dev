version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      framework:
        patterns: [next, react, react-dom, "@types/react*", eslint-config-next]
      supabase:
        patterns: ["@supabase/*", supabase]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
